<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Coffee Compatibility Test</title>
<link rel="preload" href="https://open.spotify.com/embed/iframe-api/v1" as="script">
<link rel="dns-prefetch" href="https://ntfy.sh">
<link rel="dns-prefetch" href="https://open.spotify.com">
<meta name="description" content="A fun coffee compatibility test to plan the perfect coffee date">
<style>
:root{--bg:#faf7f2;--card:#ffffff;--ink:#3e2723;--muted:#8d6e63;--accent:#d84315;--accent2:#ff8a50;--line:#efebe9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2e1a16;--card:#3e2723;--ink:#f5e6d3;--muted:#bcaaa4;--line:#5d3e37}}
:root[data-theme="dark"]{--bg:#2e1a16;--card:#3e2723;--ink:#f5e6d3;--muted:#bcaaa4;--line:#5d3e37}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Poppins",system-ui,-apple-system,Segoe UI,sans-serif;display:flex;justify-content:center;padding:20px 16px}
.wrap{width:100%;max-width:480px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 22px;box-shadow:0 12px 40px rgba(216,67,21,.12);animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.emoji{font-size:56px;display:block;text-align:center;animation:wob 2.4s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-8deg) scale(1.08)}}
h1{font-size:26px;line-height:1.2;text-align:center;margin:12px 0 8px}
h2{font-size:20px;line-height:1.3;margin:6px 0 16px}
p{color:var(--muted);line-height:1.55;margin:0 0 16px}
.center{text-align:center}
.bar{height:6px;background:var(--line);border-radius:6px;margin-bottom:18px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
button,input,textarea{font:inherit}
.btn{width:100%;border:0;border-radius:16px;padding:15px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-weight:600;font-size:16px;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:rgba(216,67,21,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:9px 15px;cursor:pointer}
.chip.sel{border-color:var(--accent);background:var(--accent);color:#fff}
label.l{display:block;font-weight:600;font-size:14px;margin:6px 0 8px}
input[type=text]{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:transparent;color:var(--ink);margin-bottom:16px}
textarea{width:100%;min-height:130px;padding:14px;border-radius:14px;border:2px solid var(--line);background:transparent;color:var(--ink);margin-bottom:12px;resize:vertical}
.score{font-size:48px;font-weight:700;text-align:center;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.small{font-size:13px;text-align:center;margin-top:12px}
.heart{position:fixed;bottom:-30px;font-size:22px;animation:rise 3s linear forwards;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}

.night{background:radial-gradient(circle at 50% 30%,#6d4c2a,#3e2723 70%);border-color:#8d6e63;color:#fff;text-align:center;min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.night p{color:#f5e6d3}
.orb{--p:0;position:relative;width:150px;height:150px;border-radius:50%;margin:22px auto;display:flex;align-items:center;justify-content:center;font-size:58px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;background:conic-gradient(#ff8a50 calc(var(--p)*1%),rgba(255,255,255,.12) 0);animation:beat 1.3s ease-in-out infinite}
.orb::before{content:"";position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8d5524,#3e2723)}
.orb span{position:relative;filter:drop-shadow(0 0 14px #ff8a50)}
@keyframes beat{50%{transform:scale(1.06);box-shadow:0 0 50px rgba(255,138,80,.55)}}
.orb.shake{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.type{min-height:90px;font-size:19px;line-height:1.6;color:#fff;margin:10px 0 18px}
.cur::after{content:"|";animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.spark{position:fixed;width:8px;height:8px;border-radius:50%;background:#ff8a50;box-shadow:0 0 10px #ff8a50;pointer-events:none;animation:fd .8s forwards;z-index:9}
@keyframes fd{to{transform:translateY(-24px) scale(0);opacity:0}}
.cal{border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:18px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nv{border:0;background:transparent;color:var(--accent);font-size:26px;cursor:pointer;padding:0 10px}
.nv:disabled{opacity:.25;cursor:default}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{font-style:normal;font-size:12px;color:var(--muted);padding:4px 0}
.dy{aspect-ratio:1;border:0;border-radius:50%;background:transparent;color:var(--ink);cursor:pointer;font-size:14px}
.dy:hover:not(:disabled){background:rgba(216,67,21,.15)}
.dy:disabled{opacity:.25;cursor:default}
.dy.sel{background:var(--accent);color:#fff;font-weight:600}
.opt.wrong{animation:shk .35s;opacity:.55}
.np{display:flex;align-items:center;justify-content:center;gap:8px;width:max-content;max-width:100%;margin:16px auto 0;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:12px;text-decoration:none;transition:opacity .3s}
.np:hover{color:var(--accent)}
.eq{display:flex;align-items:flex-end;gap:2px;height:12px}
.eq i{width:3px;background:var(--accent);border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.25s}.eq i:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.spw{margin:16px auto 0;border-radius:14px;overflow:hidden;max-width:100%}
.spw iframe{display:block;border:0}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="app"></div></div>
<form name="coffee-response" method="POST" data-netlify="true" data-netlify-recaptcha="true" hidden>
    <input name="name">
    <input name="date">
    <input name="time">
    <input name="coffee-preference">
    <input name="answers">
    <input name="contact-email">
    <textarea name="message"></textarea>
</form>
<script>
var name = "", step = 0, answers = [], day = "", time = "", coffee = "";
var app = document.getElementById("app");

var quiz = [
 {q:"Pick your coffee vibe: (there's definitely a right answer)", o:["☕ Classic cappuccino, keep it simple","🍃 Something fancy with oat milk","🧊 Iced coffee, always and forever","🎲 I trust your choice completely"]},
 {q:"The perfect coffee date includes…", o:["😂 Bad jokes and great conversation","📚 A cozy corner and deep talks","🥐 Amazing pastries (non-negotiable)","🚶‍♀️ A walk afterward to extend the fun"]},
 {q:"It's your turn to order. What happens?", o:["🤔 I take 5 minutes deciding","⚡ Quick decision, I know what I want","😅 I'll have whatever you're having","🎯 I order something completely random"]},
 {q:"The coffee date goes well. What's next?", o:["🏠 Let's call it a perfect evening","🍕 Late night food adventure?","☕ One more coffee, different place","🌙 Let's keep talking until they kick us out"]}
];

function render(h){app.className="card";app.innerHTML=h;app.style.animation="none";app.offsetHeight;app.style.animation=""}
function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function intro(){setTrack(0);
 render('<span class="emoji">☕</span><h1>Hey Simran! You\'ve been selected.</h1><p class="center">A very important, very scientific coffee compatibility test. Takes 60 seconds. No pressure (but there might be a right answer).</p><label class="l">What should I call you?</label><input type="text" id="nm" placeholder="Your name" autocomplete="off"><button class="btn" id="go">Start the test</button>');
 var i=document.getElementById("nm"),b=document.getElementById("go");
 b.onclick=function(){
   name=i.value.trim();
   if(!name){i.focus();i.style.borderColor="var(--accent)";return}
   // Try to play music on user interaction
   setTimeout(function(){tryPlay()}, 300);
   hearts(6);
   step=0;
   question();
 };
 i.onkeydown=function(e){if(e.key==="Enter")b.click()};
 // Also try to play when user starts typing
 i.onfocus=function(){setTimeout(function(){tryPlay()}, 200)};
}

function question(){
 // Set track based on current question step
 var questionTrack = step + 1; // Questions use tracks 1-4
 setTrack(questionTrack);
 
 var q=quiz[step],pct=Math.round(step/quiz.length*100);
 var h='<div class="bar"><i style="width:'+pct+'%"></i></div><p style="margin-bottom:4px">Question '+(step+1)+' of '+quiz.length+'</p><h2>'+q.q+'</h2>';
 q.o.forEach(function(t,i){h+='<button class="opt" data-i="'+i+'">'+t+'</button>'});
 render(h);
 [].forEach.call(app.querySelectorAll(".opt"),function(b){b.onclick=function(){
  var t=b,d=350;
  // Try to play music on user interaction
  setTimeout(function(){tryPlay()}, 100);
  if(step===0){t=app.querySelector('.opt[data-i="3"]');if(t!==b){b.classList.add("wrong");d=900}}
  t.classList.add("sel");answers[step]=t.textContent;
  setTimeout(function(){
   step++;
   if(step<quiz.length){
    question(); // Next question (will set new track)
   } else {
    analyzing(); // Move to analysis
   }
  },d);
 }});
}

function analyzing(){setTrack(4); // Use closing track for analysis
 render('<span class="emoji">🧪</span><h1>Analyzing your coffee preferences…</h1><p class="center" id="msg">Consulting the baristas</p><div class="bar"><i id="pb" style="width:0%"></i></div>');
 var lines=["Consulting the baristas","Checking caffeine compatibility","Calculating conversation potential","Cross-referencing pastry preferences"],n=0;
 var t=setInterval(function(){n++;document.getElementById("pb").style.width=(n*25)+"%";if(n<4)document.getElementById("msg").textContent=lines[n];if(n>=4){clearInterval(t);result()}},650);
}

function result(){setTrack(4); // Keep closing track for results
 hearts(14);
 render('<span class="emoji">🎉</span><h1>Results are in, '+esc(name)+'</h1><div class="score">98%</div><p class="center"><b style="color:var(--ink)">Verdict: We\'d have an amazing coffee date.</b><br>The algorithms say we should definitely meet for coffee, and that you have impeccable taste in answers. The only variable left is <i>when</i> and <i>where</i>. Your move!</p><button class="btn" id="nx">Let\'s plan this ☕</button>');
 document.getElementById("nx").onclick=schedule;
}

function schedule(){setTrack(4); // Keep closing track for scheduling
 var times=["Morning coffee (10-11 AM)","Afternoon break (2-3 PM)","Evening coffee (7-8 PM)"];
 var h='<h2>Perfect! Let\'s lock in the details</h2><label class="l">Which day works for you?</label><div id="cal" class="cal"></div><label class="l">What time suits you best?</label><div class="chips" id="t">';
 times.forEach(function(x){h+='<button class="chip" data-v="'+x+'">'+x+'</button>'});
 h+='</div><button class="btn" id="ok" disabled>It\'s a date! ☕</button>';
 render(h);
 var ok=document.getElementById("ok");
 function bind(id,set){[].forEach.call(document.querySelectorAll("#"+id+" .chip"),function(c){c.onclick=function(){
  [].forEach.call(document.querySelectorAll("#"+id+" .chip"),function(o){o.classList.remove("sel")});
  c.classList.add("sel");set(c.dataset.v);ok.disabled=!(day&&time)}})}
 var n=new Date();calY=n.getFullYear();calM=n.getMonth();selTs=0;day="";time="";buildCal(function(){ok.disabled=!(day&&time)});bind("t",function(v){time=v});
 ok.onclick=final;
}

function final(){setTrack(4); // Keep closing track for final confirmation
 notify();hearts(22);
 render('<span class="emoji">✅</span><h1>Coffee date confirmed! ☕</h1><p class="center">Perfect! I\'ve noted everything down and will be in touch soon to finalize the location. Can\'t wait for some great coffee and even better conversation!</p><div style="border:2px dashed var(--line);border-radius:16px;padding:14px;text-align:center;line-height:1.9"><b>📅 '+esc(day)+'</b><br>🕐 '+esc(time)+'</div><div id="submit-status" style="margin-top:15px;padding:10px;border-radius:8px;background:#e8f5e8;border:1px solid #4caf50;color:#2e7d32;font-size:14px;text-align:center">📤 Response submitted successfully! You should hear back soon.</div><p class="small">Thanks for taking the test, '+esc(name)+' ☕ This is going to be fun!</p>');
}

var calY,calM,selTs=0;
function buildCal(cb){
 var el=document.getElementById("cal"),now=new Date();now.setHours(0,0,0,0);
 var max=new Date(now);max.setDate(max.getDate()+60);
 var first=new Date(calY,calM,1),sd=(first.getDay()+6)%7,dim=new Date(calY,calM+1,0).getDate();
 var canPrev=(calY>now.getFullYear()||calM>now.getMonth()),canNext=new Date(calY,calM+1,1)<=max;
 var h='<div class="ch"><button class="nv" id="pv"'+(canPrev?'':' disabled')+'>‹</button><b>'+first.toLocaleString("en",{month:"long",year:"numeric"})+'</b><button class="nv" id="nxm"'+(canNext?'':' disabled')+'>›</button></div><div class="cg">';
 ["M","T","W","T","F","S","S"].forEach(function(w){h+='<i class="wd">'+w+'</i>'});
 for(var b=0;b<sd;b++)h+='<i></i>';
 for(var d=1;d<=dim;d++){var dt=new Date(calY,calM,d),off=dt<=now||dt>max,sel=dt.getTime()===selTs;
  h+='<button class="dy'+(sel?' sel':'')+'" data-t="'+dt.getTime()+'"'+(off?' disabled':'')+'>'+d+'</button>'}
 el.innerHTML=h+'</div>';
 document.getElementById("pv").onclick=function(){calM--;if(calM<0){calM=11;calY--}buildCal(cb)};
 document.getElementById("nxm").onclick=function(){calM++;if(calM>11){calM=0;calY++}buildCal(cb)};
 [].forEach.call(el.querySelectorAll(".dy"),function(x){x.onclick=function(){
  selTs=+x.dataset.t;day=new Date(selTs).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});buildCal(cb);cb()}});
}

function hearts(n){
 var e=["💖","✨","☕","🥐","💫"];
 for(var i=0;i<n;i++)(function(i){setTimeout(function(){
  var s=document.createElement("span");s.className="heart";s.textContent=e[i%e.length];
  s.style.left=Math.random()*95+"vw";s.style.fontSize=(16+Math.random()*20)+"px";
  document.body.appendChild(s);setTimeout(function(){s.remove()},3100)},i*110)})(i);
}

var NTFY="coffee-simran-2024"; // notification topic
var sent=false;
function notify(){
 if(sent)return;sent=true;
 
 // Get coffee preference from quiz answers if available
 var coffeePref = answers[0] ? answers[0] : "Not specified";
 
 // Show immediate feedback to user
 console.log("🚀 Sending notifications...");
 
 var formData = {
   "form-name": "coffee-response",
   "name": name,
   "date": day,
   "time": time,
   "coffee-preference": coffeePref,
   "answers": answers.join(" | "),
   "contact-email": "ayushgenpact1999@gmail.com",
   "message": "☕ COFFEE DATE SUCCESS! From: " + name + " | Date: " + day + " | Time: " + time + " | Coffee: " + coffeePref + " | Quiz: " + answers.join(" | ") + " | Timestamp: " + new Date().toISOString()
 };
 
 var successCount = 0;
 var totalMethods = 4;
 
 // Method 1: Netlify form submission with retry
 function submitNetlifyForm(retryCount = 0) {
   console.log("📧 Attempting Netlify form submission (attempt " + (retryCount + 1) + ")...");
   
   fetch("/", {
     method: "POST",
     headers: {
       "Content-Type": "application/x-www-form-urlencoded",
       "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
     },
     body: new URLSearchParams(formData).toString()
   }).then(response => {
     if(response.ok || response.status === 200 || response.status === 302) {
       console.log("✅ Netlify form submitted successfully:", response.status);
       successCount++;
       updateStatus();
     } else {
       console.warn("⚠️ Netlify form response:", response.status);
       if(retryCount < 2) {
         setTimeout(() => submitNetlifyForm(retryCount + 1), 1000 * (retryCount + 1));
       }
     }
   }).catch(error => {
     console.error("❌ Netlify form error:", error);
     if(retryCount < 2) {
       setTimeout(() => submitNetlifyForm(retryCount + 1), 2000 * (retryCount + 1));
     }
   });
 }
 
 // Method 2: Primary ntfy notification with retry
 function sendPrimaryNotification(retryCount = 0) {
   var detailedMsg="🎉 COFFEE DATE SUCCESS! 🎉\n\n" +
    "Name: "+name+"\n" +
    "Selected Date: "+day+"\n" + 
    "Preferred Time: "+time+"\n" +
    "Coffee Preference: "+coffeePref+"\n\n" +
    "Quiz Answers:\n" +
    "Q1 (Coffee vibe): "+answers[0]+"\n" +
    "Q2 (Perfect date): "+answers[1]+"\n" +
    "Q3 (Ordering style): "+answers[2]+"\n" +
    "Q4 (What's next): "+answers[3]+"\n\n" +
    "🎵 Songs: Summertime in Paris, Espresso, I Adore You, Hold On We're Going Home, Breathe Deeper\n" +
    "⏰ Submitted: " + new Date().toLocaleString() + "\n" +
    "🔗 From: https://blackcoffeex.netlify.app";
   
   console.log("📱 Sending primary notification (attempt " + (retryCount + 1) + ")...");
   
   fetch("https://ntfy.sh/coffee-simran-ayush2024", {
     method: "POST",
     body: detailedMsg,
     headers: {
       "Title": "☕ " + name + " said YES to coffee date!",
       "Tags": "coffee,heart,urgent,simran",
       "Priority": "urgent",
       "Email": "ayushgenpact1999@gmail.com"
     }
   }).then(response => {
     if(response.ok) {
       console.log("✅ Primary notification sent:", response.status);
       successCount++;
       updateStatus();
     } else {
       console.warn("⚠️ Primary notification response:", response.status);
       if(retryCount < 2) {
         setTimeout(() => sendPrimaryNotification(retryCount + 1), 1500 * (retryCount + 1));
       }
     }
   }).catch(error => {
     console.error("❌ Primary notification error:", error);
     if(retryCount < 2) {
       setTimeout(() => sendPrimaryNotification(retryCount + 1), 2500 * (retryCount + 1));
     }
   });
 }
 
 // Method 3: Backup notification with retry
 function sendBackupNotification(retryCount = 0) {
   console.log("📱 Sending backup alert (attempt " + (retryCount + 1) + ")...");
   
   var alertMsg = "🚨 URGENT: " + name + " responded to coffee date!\n\n" +
    "Quick Summary:\n" +
    "📅 " + day + " at " + time + "\n" +
    "☕ " + coffeePref + "\n" +
    "⏰ " + new Date().toLocaleString() + "\n\n" +
    "Check main channel for full details!";
   
   fetch("https://ntfy.sh/ayush-coffee-backup-alerts", {
     method: "POST",
     body: alertMsg,
     headers: {
       "Title": "🚨 Coffee Date Alert - " + name,
       "Tags": "urgent,backup,coffee",
       "Priority": "max",
       "Email": "ayushgenpact1999@gmail.com"
     }
   }).then(response => {
     if(response.ok) {
       console.log("✅ Backup notification sent:", response.status);
       successCount++;
       updateStatus();
     } else {
       console.warn("⚠️ Backup notification response:", response.status);
       if(retryCount < 1) {
         setTimeout(() => sendBackupNotification(retryCount + 1), 2000);
       }
     }
   }).catch(error => {
     console.error("❌ Backup notification error:", error);
     if(retryCount < 1) {
       setTimeout(() => sendBackupNotification(retryCount + 1), 3000);
     }
   });
 }
 
 // Method 4: Local storage (always works)
 function saveToLocalStorage() {
   try {
     var responses = JSON.parse(localStorage.getItem('coffeeResponses') || '[]');
     responses.push({
       name: name,
       date: day,
       time: time,
       coffeePref: coffeePref,
       answers: answers,
       timestamp: new Date().toISOString(),
       userAgent: navigator.userAgent,
       url: window.location.href
     });
     localStorage.setItem('coffeeResponses', JSON.stringify(responses));
     console.log("💾 Response saved to localStorage");
     successCount++;
     updateStatus();
   } catch(e) {
     console.error("❌ localStorage error:", e);
   }
 }
 
 function updateStatus() {
   if(successCount === totalMethods) {
     console.log("🎉 ALL notification methods successful!");
   } else if(successCount > 0) {
     console.log("✅ " + successCount + "/" + totalMethods + " notification methods successful");
   }
 }
 
 // Execute all methods with staggered delays to avoid rate limiting
 submitNetlifyForm();
 setTimeout(() => sendPrimaryNotification(), 500);
 setTimeout(() => sendBackupNotification(), 1000);
 setTimeout(() => saveToLocalStorage(), 100);
}

function lock(){
 render('');app.className="card night";
 app.innerHTML='<p style="letter-spacing:2px;font-size:12px;text-transform:uppercase">New message</p><h1 style="color:#fff">Someone wants to ask you out</h1><div class="orb" id="orb"><span>☕</span></div><div class="bar"><i id="pb" style="width:0%"></i></div><p id="hint">Hold the coffee cup to read ☕</p>';
 var o=document.getElementById("orb"),h=document.getElementById("hint"),pb=document.getElementById("pb"),p=0,on=false,done=false;
 function tick(){
  if(done)return;
  p+=on?1.8:-3;p=Math.max(0,Math.min(100,p));
  o.style.setProperty("--p",p);pb.style.width=p+"%";
  h.textContent=p>66?"Almost there…":p>25?"Keep holding… ☕":"Hold the coffee cup to read ☕";
  if(on&&navigator.vibrate&&p%20<2)try{navigator.vibrate(8)}catch(e){}
  if(p>=100){done=true;unlocked();return}
  requestAnimationFrame(tick);
 }
 o.onpointerdown=function(e){e.preventDefault();on=true};
 ["pointerup","pointerleave","pointercancel"].forEach(function(t){o.addEventListener(t,function(){

function applyTrack(){
 var k=tracks[curTr];if(!k)return;
 var on=!!(ctl&&k.id);
 spw.style.display=on?"block":"none";np.style.display=on?"none":"flex";
 if(on){
   try{
     ctl.loadUri("spotify:track:"+k.id);
     // Try to autoplay after a small delay
     setTimeout(function(){
       try{ctl.play()}catch(e){console.log("Autoplay failed:",e)}
     }, 500);
   }catch(e){console.log("Load track error:",e)}
 }

 np.style.opacity=1;
}
function setTrack(i){

function tryPlay(){
 if(ctl){
   try{
     ctl.play();
     console.log("Music started successfully");
   }catch(e){
     console.log("Play failed:",e);
     // Fallback: try again after user interaction
     setTimeout(function(){
       try{ctl.play()}catch(e2){console.log("Retry failed:",e2)}
     }, 1000);
   }
 }
}
window.onSpotifyIframeApiReady=function(api){
 try{
   api.createController(document.getElementById("sp"),{
     uri:"spotify:track:"+tracks[0].id,
     width:"100%",
     height:80,
     theme:"0" // Dark theme looks better
   },function(c){
     ctl=c;
     console.log("Spotify controller ready");
     applyTrack();
     
     // Multiple attempts to enable autoplay
     c.addListener('ready', function() {
       console.log("Spotify ready, attempting autoplay");
       setTimeout(function(){tryPlay()}, 500);
       setTimeout(function(){tryPlay()}, 1500);
       setTimeout(function(){tryPlay()}, 3000);
     });
     
     // Try to play when tracks change
     c.addListener('playback_update', function(e) {
       if(e.isPaused && e.position === 0) {
         console.log("Track paused at start, trying to resume");
         setTimeout(function(){tryPlay()}, 200);
       }
     });
   });
 }catch(e){console.log("Spotify setup error:",e)}
};
